services:
  - type: web
    name: replens-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://replens.lemy.dev
