name: Submission checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check_submission.py
      - run: python3 scripts/validate_research_artifacts.py
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replens
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: replens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replens -d replens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REPLENS_TEST_DATABASE_URL: postgresql+psycopg://replens:localtest@127.0.0.1:5432/replens_test
      DATABASE_URL: postgresql+psycopg://replens:localtest@127.0.0.1:5432/replens_test
      JWT_SECRET: unit-test-secret-that-is-long-enough-for-hs256
      AUTH_FRONTEND_URL: http://localhost:5173
      RESEND_API_KEY: test-resend-key
      EMAIL_FROM: RepLens Test <test@example.invalid>
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install -r app/backend/requirements-test.txt
      - run: coverage run --branch --source=app.backend.auth,app.backend.routes,app.backend.services,app.backend.sessions -m unittest discover -s app/backend/tests -v
      - run: coverage report -m
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
