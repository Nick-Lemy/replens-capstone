<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#17191e" />
        <meta
            name="description"
            content="Review your curl set with experimental video-based repetition estimates."
        />
        <link rel="icon" href="/icon.svg" />
        <title>RepLens</title>
        <script>
            try {
                const t = localStorage.getItem("replens-theme");
                document.documentElement.classList.toggle(
                    "dark",
                    t !== "light",
                );
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
