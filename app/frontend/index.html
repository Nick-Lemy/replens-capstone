<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#17191e" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta
            name="description"
            content="Review your curl set with experimental video-based repetition estimates."
        />
        <link id="app-icon" rel="icon" href="/icon-192.png" type="image/png" />
        <title>RepLens</title>
        <script>
            try {
                const t = localStorage.getItem("replens-theme");
                const light = t === "light";
                document.documentElement.classList.toggle(
                    "dark",
                    !light,
                );
                document.querySelector('#app-icon').href = light
                    ? '/icon-light-192.png'
                    : '/icon-192.png';
                document.querySelector('meta[name="theme-color"]').content = light
                    ? '#f5f5f2'
                    : '#17191e';
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
